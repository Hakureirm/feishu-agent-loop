name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-tests:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: bash -n skills/feishu-agent-loop/scripts/listen.sh
      - name: Offline regression tests (no Lark credentials or network calls)
        run: python3 -m unittest discover -s tests -v
